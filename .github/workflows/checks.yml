name: Checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: docker compose up -d --wait
      - run: uv run --locked python -m mle.db
      - run: uv run --locked python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/companies
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v